name: Publish ABEDOME Supervisor
run-name: "Publish ABEDOME Supervisor ${{ inputs.version }}"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable ABEDOME Supervisor version
        required: true
        default: 2026.10.5
        type: string

permissions: {}

concurrency:
  group: publish-abedome-supervisor
  cancel-in-progress: false

env:
  BASE_IMAGE: ghcr.io/home-assistant/base-python:3.14-alpine3.24-2026.10.3
  SUPERVISOR_VERSION: "2026.10.5"

jobs:
  publish:
    name: Publish the OVA x86-64 ABEDOME Supervisor image
    if: github.ref == 'refs/heads/abedome/develop'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    steps:
      - name: Check out ABEDOME Supervisor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the immutable version request
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_VERSION" != "$SUPERVISOR_VERSION" ]]; then
            echo "::error::Only $SUPERVISOR_VERSION may be published; received $REQUESTED_VERSION"
            exit 1
          fi

      - name: Derive image and unique candidate tag
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/abedome-supervisor" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify and pin the signed upstream base image
        id: base
        shell: bash
        run: |
          set -euo pipefail
          verification="$(cosign verify --output json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp https://github.com/home-assistant/docker-base/.* \
            "$BASE_IMAGE")"
          printf '%s\n' "$verification"
          digest="$(jq -er '.[0].critical.image["docker-manifest-digest"]' <<< "$verification")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Cosign did not return a valid base image digest"
            exit 1
          fi
          echo "ref=$BASE_IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing immutable image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_PACKAGE: abedome-supervisor
          GHCR_TAG: ${{ inputs.version }}
        run: |
          python3 script/abedome/check_ghcr_tag.py \
            --owner "$GHCR_OWNER" \
            --package "$GHCR_PACKAGE" \
            --tag "$GHCR_TAG"

      - name: Build and publish the uniquely tagged candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.candidate_tag }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.ref }}
            BUILD_VERSION=${{ inputs.version }}
            BUILD_REVISION=${{ github.sha }}
          provenance: true
          sbom: true

      - name: Verify candidate digest, labels, version, and policy
        env:
          CANDIDATE_TAG: ${{ steps.image.outputs.candidate_tag }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not return a valid candidate digest"
            exit 1
          fi
          candidate_image="$IMAGE_NAME:$CANDIDATE_TAG"
          candidate_ref="$IMAGE_NAME@$EXPECTED_DIGEST"
          inspection="$(docker buildx imagetools inspect "$candidate_image")"
          printf '%s\n' "$inspection"
          actual_digest="$(printf '%s\n' "$inspection" | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ "$actual_digest" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::Candidate digest $actual_digest does not match $EXPECTED_DIGEST"
            exit 1
          fi

          docker pull "$candidate_ref"
          hass_type="$(docker inspect "$candidate_ref" --format '{{ index .Config.Labels "io.hass.type" }}')"
          hass_version="$(docker inspect "$candidate_ref" --format '{{ index .Config.Labels "io.hass.version" }}')"
          image_version="$(docker inspect "$candidate_ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          image_revision="$(docker inspect "$candidate_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          image_source="$(docker inspect "$candidate_ref" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
          [[ "$hass_type" == supervisor ]]
          [[ "$hass_version" == "$EXPECTED_VERSION" ]]
          [[ "$image_version" == "$EXPECTED_VERSION" ]]
          [[ "$image_revision" == "$EXPECTED_REVISION" ]]
          [[ "$image_source" == https://github.com/Mauro2020/abedome-supervisor ]]

          docker run --rm -i --entrypoint python3 "$candidate_ref" - <<'PY'
          from supervisor.brand import (
              ABEDOME_CORE_IMAGE,
              ABEDOME_SUPERVISOR_IMAGE,
              ABEDOME_UPDATE_FEED,
              apply_upstream_diagnostics_policy,
          )
          from supervisor.const import SUPERVISOR_VERSION, URL_HASSIO_VERSION

          assert SUPERVISOR_VERSION == "2026.10.5"
          assert ABEDOME_CORE_IMAGE == "ghcr.io/mauro2020/abedome-core"
          assert ABEDOME_SUPERVISOR_IMAGE == "ghcr.io/mauro2020/abedome-supervisor"
          assert URL_HASSIO_VERSION == ABEDOME_UPDATE_FEED
          assert apply_upstream_diagnostics_policy(True) is False
          PY

      - name: Promote the verified digest to the immutable version
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ inputs.version }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$EXPECTED_VERSION" \
            "$IMAGE_NAME@$EXPECTED_DIGEST"

      - name: Confirm the promoted tag is the same digest
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ inputs.version }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          image="$IMAGE_NAME:$EXPECTED_VERSION"
          inspection="$(docker buildx imagetools inspect "$image")"
          printf '%s\n' "$inspection"
          promoted_digest="$(printf '%s\n' "$inspection" | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ "$promoted_digest" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::Promoted digest $promoted_digest does not match $EXPECTED_DIGEST"
            exit 1
          fi

      - name: Summarize the immutable OVA image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          SOURCE_REVISION: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## ABEDOME Supervisor image"
            echo
            echo "- Immutable image: \`$IMAGE_NAME:$VERSION\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Architecture: \`linux/amd64\` (ABEDOME OS OVA only)"
            echo "- Source revision: \`$SOURCE_REVISION\`"
            echo
            echo "The immutable tag points to the same digest as the verified candidate."
            echo "This workflow does not modify or publish the ABEDOME OS update feed."
          } >> "$GITHUB_STEP_SUMMARY"
