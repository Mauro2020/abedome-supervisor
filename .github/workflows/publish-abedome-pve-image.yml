name: Publish versioned ABEDOME Supervisor test image

on:
  workflow_dispatch:
    inputs:
      supervisor_version:
        description: "Immutable ABEDOME test version, for example 2026.8.0.dev1"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: abedome-supervisor-versioned-image
  cancel-in-progress: false

jobs:
  test:
    name: Test Supervisor
    runs-on: ubuntu-24.04
    steps:
      - name: Check out selected source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install PulseAudio test library
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Run Supervisor test suite
        run: |
          python -m pip install --upgrade pip tox
          tox -e tests --skip-pkg-install -- --timeout=30

  publish:
    name: Publish x86-64 versioned test image
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out selected source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate immutable test version
        env:
          SUPERVISOR_VERSION: ${{ inputs.supervisor_version }}
        run: |
          if ! printf '%s' "${SUPERVISOR_VERSION}" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+\.dev[0-9]+$'; then
            echo "Use a test version such as 2026.8.0.dev1."
            exit 1
          fi

      - name: Derive container reference
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SUPERVISOR_VERSION: ${{ inputs.supervisor_version }}
        run: |
          owner="${REPOSITORY_OWNER,,}"
          echo "reference=ghcr.io/${owner}/abedome-supervisor:${SUPERVISOR_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=${{ inputs.supervisor_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.supervisor_version }}
            org.opencontainers.image.description=ABEDOME Supervisor versioned test image
          tags: ${{ steps.image.outputs.reference }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Verify the published image
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: docker buildx imagetools inspect "${IMAGE_REFERENCE}"

      - name: Publish summary
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          SUPERVISOR_VERSION: ${{ inputs.supervisor_version }}
        run: |
          {
            echo "## ABEDOME Supervisor versioned test image"
            echo
            echo "- Image: \`${IMAGE_REFERENCE}\`"
            echo "- Supervisor version: \`${SUPERVISOR_VERSION}\`"
            echo "- Architecture: \`linux/amd64\`"
            echo "- Source revision: \`${GITHUB_SHA}\`"
            echo
            echo "The image tag and Supervisor version are intentionally identical."
            echo "This is a test image only. It does not activate the ABEDOME update feed."
          } >> "$GITHUB_STEP_SUMMARY"
