name: Publish ABEDOME Supervisor PVE image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable test tag, for example pve-7a80dabad258"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: abedome-supervisor-pve-image
  cancel-in-progress: false

jobs:
  test:
    name: Test Supervisor
    runs-on: ubuntu-24.04
    steps:
      - name: Check out selected source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install PulseAudio test library
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Run Supervisor test suite
        run: |
          python -m pip install --upgrade pip tox
          tox -e tests --skip-pkg-install -- --timeout=30

  publish:
    name: Publish x86-64 test image
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out selected source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate immutable test tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          case "${IMAGE_TAG}" in
            "" | -* | *..* | *[!a-zA-Z0-9._-]*)
              echo "Use a non-empty tag made only of letters, digits, dots, underscores, and dashes."
              exit 1
              ;;
          esac

      - name: Derive container reference
        id: image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="${REPOSITORY_OWNER,,}"
          echo "reference=ghcr.io/${owner}/abedome-supervisor:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish PVE image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=9999.09.9.dev${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=ABEDOME Supervisor PVE validation image
          tags: ${{ steps.image.outputs.reference }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Verify the published image
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: docker buildx imagetools inspect "${IMAGE_REFERENCE}"

      - name: Publish summary
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          {
            echo "## ABEDOME Supervisor PVE image"
            echo
            echo "- Image: \`${IMAGE_REFERENCE}\`"
            echo "- Architecture: \`linux/amd64\`"
            echo "- Source revision: \`${GITHUB_SHA}\`"
            echo
            echo "This is a test image only. It does not activate the ABEDOME update feed."
          } >> "$GITHUB_STEP_SUMMARY"
